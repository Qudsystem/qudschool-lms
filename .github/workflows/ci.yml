name: Code Quality CI

on: [push, pull_request]

jobs:
  web:
    name: Web (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (vite)
        run: npm run build

  python-tools:
    name: Python dev tools (ruff + bandit + pytest)
    runs-on: ubuntu-latest
    continue-on-error: true   # dev-only tooling; never blocks web CI
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format and Analyze with Ruff
        run: |
          ruff format .
          ruff check . --fix

      - name: Security Scan with Bandit
        run: bandit -r . || true

      - name: Run Tests with Pytest
        run: pytest --cov=. || true
