<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" role="img" aria-label="Entrepreneur">
  <title>Entrepreneur</title>
  <!-- Entrepreneur magazine uses a bold sans-serif with a distinctive "E" mark -->
  <!-- Stylized bold E icon -->
  <rect x="0" y="8" width="28" height="44" rx="3" fill="#E8282B"/>
  <rect x="6" y="14" width="16" height="6" rx="1" fill="white"/>
  <rect x="6" y="27" width="13" height="6" rx="1" fill="white"/>
  <rect x="6" y="40" width="16" height="6" rx="1" fill="white"/>
  <!-- Wordmark -->
  <text
    x="38"
    y="43"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-0.3"
    fill="#111827"
  >entrepreneur</text>
</svg>
