<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Forbes">
  <title>Forbes</title>
  <!-- Forbes iconic gold/black capitalized bold italic serif -->
  <!-- Top decorative line (Forbes uses thin rules) -->
  <rect x="8" y="8" width="184" height="2" fill="#111111"/>
  <rect x="8" y="46" width="184" height="2" fill="#111111"/>
  <!-- Wordmark: bold italic serif -->
  <text
    x="100"
    y="40"
    text-anchor="middle"
    font-family="'Times New Roman', 'Didot', 'Bodoni MT', 'Georgia', serif"
    font-size="34"
    font-weight="700"
    font-style="italic"
    letter-spacing="3"
    fill="#111111"
  >FORBES</text>
</svg>
