<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" role="img" aria-label="QudSchool - كودسكول">
  <defs>
    <linearGradient id="qBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="qGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#0F9D58"/>
    </linearGradient>
    <linearGradient id="qYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#F9AB00"/>
    </linearGradient>
    <linearGradient id="qRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#D33B2C"/>
    </linearGradient>
    <linearGradient id="qOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <!-- Q ring: drawn as thick arcs in Google colors -->
  <g fill="none" stroke-width="58" stroke-linecap="round">
    <!-- Blue: left + top -->
    <path d="M 96 210 A 164 164 0 0 1 300 78" stroke="url(#qBlue)"/>
    <path d="M 96 210 A 164 164 0 0 0 110 288" stroke="url(#qBlue)"/>
    <!-- Orange: top-right small -->
    <path d="M 300 78 A 164 164 0 0 1 372 96" stroke="url(#qOrange)"/>
    <!-- Green: right upper -->
    <path d="M 372 96 A 164 164 0 0 1 440 200" stroke="url(#qGreen)"/>
    <!-- Yellow: right lower -->
    <path d="M 440 200 A 164 164 0 0 1 402 322" stroke="url(#qYellow)"/>
    <!-- Red: bottom + tail -->
    <path d="M 402 322 A 164 164 0 0 1 300 374" stroke="url(#qRed)"/>
    <path d="M 300 374 A 164 164 0 0 1 176 356" stroke="url(#qRed)"/>
    <!-- Orange: bottom-left -->
    <path d="M 176 356 A 164 164 0 0 1 110 288" stroke="url(#qOrange)"/>
  </g>

  <!-- Q tail (red) -->
  <path d="M 330 330 L 430 430" stroke="url(#qRed)" stroke-width="58" stroke-linecap="round" fill="none"/>

  <!-- Laptops / kids hint: stylized books/laptops -->
  <g transform="translate(200,230)">
    <!-- laptop base -->
    <rect x="-70" y="30" width="150" height="12" rx="6" fill="#334155"/>
    <!-- laptop screen -->
    <path d="M -55 30 L -40 -30 L 60 -30 L 45 30 Z" fill="#1E293B"/>
    <path d="M -50 25 L -38 -25 L 54 -25 L 42 25 Z" fill="#38BDF8" opacity="0.85"/>
    <!-- code lines -->
    <g stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-30" y1="-12" x2="30" y2="-12"/>
      <line x1="-32" y1="-2" x2="10" y2="-2"/>
      <line x1="-34" y1="8" x2="24" y2="8"/>
      <line x1="-36" y1="18" x2="0" y2="18"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Poppins','Segoe UI',Arial,sans-serif" font-weight="800" font-size="66" text-anchor="middle">
    <text x="260" y="452">
      <tspan fill="#4285F4">Q</tspan><tspan fill="#EA4335">u</tspan><tspan fill="#FBBC05">d</tspan><tspan fill="#34A853">S</tspan><tspan fill="#EA4335">c</tspan><tspan fill="#4285F4">h</tspan><tspan fill="#34A853">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#EA4335">l</tspan>
    </text>
  </g>
</svg>
