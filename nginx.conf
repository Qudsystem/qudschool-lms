user  nginx;
worker_processes  auto;
events { worker_connections 1024; }

http {
  # Basic optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  
  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # MIME
  include       mime.types;
  default_type  application/octet-stream;

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name  192.168.1.5;

    ssl_certificate     /etc/ssl/certs/qudschool.crt;      # replace with generated path
    ssl_certificate_key /etc/ssl/private/qudschool.key;   # replace with generated path
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:...';

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(),microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com https://*.wikimedia.org; font-src 'self' https://fonts.gstatic.com;" always;

    root /var/www/qudschool;
    index index.html;

    # Static caching
    location ~* \.(?:css|js)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    # App fallback
    location / {
      try_files $uri /index.html;
    }
  }

  # Redirect HTTP -> HTTPS
  server {
    listen 80;
    server_name 192.168.1.5;
    return 301 https://$host$request_uri;
  }
}
